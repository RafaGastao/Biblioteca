<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-end">
        <a href="/login" class="btn btn-outline-primary mb-3">Ir para Login</a>
    </div>

    <div class="card shadow p-4">

        <h2 class="mb-4">Cadastro de Usuário</h2>

        <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}">

            <div class="row mb-3">
                <div class="col">
                    <input type="text" th:field="*{nome}" class="form-control" placeholder="Nome" required>
                </div>

                <div class="col">
                    <input type="text" th:field="*{matricula}" class="form-control" placeholder="Matrícula" required>
                </div>
            </div>

            <div class="mb-3">
                <input type="text" th:field="*{endereco}" class="form-control" placeholder="Endereço">
            </div>

            <div class="row mb-3">
                <div class="col">
                    <input type="text" th:field="*{login}" class="form-control" placeholder="Login" required>
                </div>

                <div class="col">
                    <input type="password" th:field="*{senha}" class="form-control" placeholder="Senha" required>
                </div>
            </div>

            <div class="mb-3">
                <select th:field="*{tipoUsuario}" class="form-select" required>
                    <option value="">Selecione o tipo</option>
                    <option value="ALUNO">Aluno</option>
                    <option value="PROFESSOR">Professor</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/admin" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-success">Cadastrar</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
