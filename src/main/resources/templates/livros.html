<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">


    <a th:href="${session.usuarioLogado.tipoUsuario == 'FUNCIONARIO'} ? '/admin' : '/emprestimos'" 
       class="btn btn-secondary mb-3">⬅ Voltar</a>

    <h1 class="mb-4"> Livros</h1>


    <div th:if="${session.usuarioLogado.tipoUsuario == 'FUNCIONARIO'}">

        <div class="card p-4 mb-4 shadow-sm">
            <h4>Cadastro de Livros</h4>

            <form th:action="@{/livros/salvar}" method="post" th:object="${livro}">
                <div class="row mb-3">
                    <div class="col">
                        <input type="text" th:field="*{titulo}" class="form-control" placeholder="Título" required>
                    </div>
                    <div class="col">
                        <input type="text" th:field="*{autor}" class="form-control" placeholder="Autor" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <input type="number" th:field="*{quantidade}" class="form-control" placeholder="Quantidade" required>
                    </div>
                    <div class="col">
                        <input type="text" th:field="*{categoria}" class="form-control" placeholder="Categoria">
                    </div>
                    <div class="col">
                        <input type="number" th:field="*{anoPublicacao}" class="form-control" placeholder="Ano">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>

    </div>

    <h2>Lista de Livros</h2>

    <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Quantidade</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="l : ${livros}">
                <td th:text="${l.titulo}"></td>
                <td th:text="${l.autor}"></td>
                <td th:text="${l.quantidade}"></td>

                <td>

                    <div th:if="${session.usuarioLogado.tipoUsuario != 'FUNCIONARIO'}">

                        <!-- 🔥 SE TEM LIVRO -->
                        <form th:if="${l.quantidade > 0}" th:action="@{/emprestimos/realizar}" method="post">
                            <input type="hidden" name="livroId" th:value="${l.id}">
                            <button class="btn btn-success btn-sm">Pegar</button>
                        </form>
                        <span th:if="${l.quantidade == 0}" class="text-danger fw-bold">
                            Indisponível
                        </span>

                    </div>

                    <div th:if="${session.usuarioLogado.tipoUsuario == 'FUNCIONARIO'}">
                        <span class="text-muted">Admin</span>
                    </div>

                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
